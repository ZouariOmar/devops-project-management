server:
  enabled: true

  persistentVolume:
    enabled: true
    size: 8Gi

  retention: "15d"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  service:
    type: ClusterIP
    servicePort: 80

alertmanager:
  enabled: true

  persistentVolume:
    enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
