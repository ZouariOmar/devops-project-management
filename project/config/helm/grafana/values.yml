# ==================================================================================
# .FILE
#   values.yml
#
# .SYNOPSIS
#   Grafana Helm chart values
#
# .DESCRIPTION
#   Used by `k8s/setup`. Needs the `grafana-admin` Secret.
#
# .PARAMETER
#   N/A
#
# .INPUTS
#   None.
#
# .OUTPUTS
#   None.
#
# .NOTES
#   Version       : 1.0
#   Author        : @ZouariOmar (zouariomar20@gmail.com)
#   Created       : 2026-11-25
#   Changelog     : e1e38b7
# ==================================================================================

replicas: 1

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

service:
  type: NodePort
  nodePort: 30300
  port: 80

# Default Prometheus datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

# Enable dashboard provisioning
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
